[project]
name = "cra"
version = "0.1.0"
description = "Homework1 Code Review Agent 代码审查Agent"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.20.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "ruff>=0.6",
    "click>=8.0",
    "tiktoken>=0.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.25",
]
test = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]