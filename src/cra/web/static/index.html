<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Review Agent · 代码审查智能体</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2330; --border: #2d3748;
    --text: #e6edf3; --muted: #8b949e; --accent: #4f8ef7; --accent-2: #7aa2f7;
    --green: #3fb950; --red: #f85149; --orange: #f0883e; --yellow: #d29922; --blue: #58a6ff;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    background: rgba(22, 27, 34, .85); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--accent-2); }
  .header-right { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.bad { background: var(--red); }

  .container { display: grid; grid-template-columns: minmax(380px, 44%) 1fr; gap: 20px; padding: 22px 28px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 980px) { .container { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
  }
  .card h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }

  textarea {
    width: 100%; height: 260px; resize: vertical;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; line-height: 1.55;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 4px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); color: var(--muted); background: var(--panel-2);
    transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  input[type="text"] {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 7px 10px; font-size: 13px; width: 180px;
    font-family: Consolas, monospace;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .rules { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 6px; }
  .rules label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .rules input { accent-color: var(--accent); }
  .rules label:hover { color: var(--text); }

  button.primary {
    margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #4f8ef7, #7aa2f7); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .05s;
  }
  button.primary:hover { opacity: .92; }
  button.primary:active { transform: scale(.99); }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }

  /* 右侧：轨迹与报告 */
  .right { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  #timeline { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .evt {
    display: flex; gap: 10px; font-size: 13px; line-height: 1.5;
    padding: 7px 10px; border-radius: 8px; background: var(--panel-2);
    animation: fadein .3s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .evt .ts { color: var(--muted); font-family: Consolas, monospace; flex-shrink: 0; min-width: 48px; text-align: right; }
  .evt.tool { border-left: 3px solid var(--orange); }
  .evt.llm  { border-left: 3px solid var(--blue); }
  .evt.state{ border-left: 3px solid var(--green); }
  .evt.error{ border-left: 3px solid var(--red); color: #ffa198; }
  .evt.pending { color: var(--muted); }

  .spin {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #report .finding {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .f-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge {
    padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff;
  }
  .badge.Blocker { background: var(--red); }
  .badge.Major   { background: var(--orange); }
  .badge.Minor   { background: var(--yellow); color: #1b1f24; }
  .badge.Info    { background: var(--blue); }
  .f-title { font-size: 14.5px; font-weight: 600; }
  .f-meta { font-size: 12px; color: var(--muted); font-family: Consolas, monospace; }
  .f-sec { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .f-body { font-size: 13.5px; margin-top: 3px; line-height: 1.55; }
  .f-body code {
    background: #0d1117; padding: 2px 6px; border-radius: 5px;
    font-family: Consolas, monospace; font-size: 12.5px; color: #f0c674;
  }
  .conf-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .conf-bar { width: 70px; height: 6px; border-radius: 3px; background: #30363d; overflow: hidden; }
  .conf-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); }
  .conf-num { font-size: 11.5px; color: var(--muted); font-family: Consolas, monospace; }

  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
  .summary-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 13px; color: var(--muted);
  }
  .summary-bar b { color: var(--text); }
  a.dl {
    margin-left: auto; color: var(--accent-2); font-size: 12.5px; text-decoration: none;
    border: 1px solid var(--border); padding: 4px 12px; border-radius: 6px;
  }
  a.dl:hover { border-color: var(--accent); }
  .err-banner {
    background: rgba(248, 81, 73, .12); border: 1px solid var(--red); color: #ffa198;
    border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.6;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 0 26px; }
</style>
</head>
<body>
<header>
  <h1>🔍 Code Review <span>Agent</span></h1>
  <div class="header-right">
    <span id="model-name"></span>
    <span class="dot" id="key-dot"></span><span id="key-text">检查 API Key…</span>
  </div>
</header>

<div class="container">
  <!-- 左侧：输入区 -->
  <div class="card">
    <h2>提交待审查代码</h2>
    <textarea id="code" spellcheck="false" placeholder="在此粘贴 Python 代码，或点击下方样例快速载入…"></textarea>
    <div class="row">
      <span style="font-size:12.5px;color:var(--muted)">快速载入样例：</span>
      <div class="chips">
        <span class="chip" onclick="loadExample('test_case.py')">正常样例</span>
        <span class="chip" onclick="loadExample('bad_case.py')">语法错误</span>
        <span class="chip" onclick="loadExample('empty.py')">空文件</span>
      </div>
    </div>
    <div class="row">
      <span style="font-size:12.5px;color:var(--muted)">文件名：</span>
      <input type="text" id="filename" value="upload.py">
      <label style="font-size:12.5px;color:var(--muted);cursor:pointer">
        <input type="file" id="file-input" accept=".py" style="display:none" onchange="loadFile(this)">
        <span class="chip">📂 上传 .py 文件</span>
      </label>
    </div>
    <div class="rules" id="rules">
      <label><input type="checkbox" value="bug" checked> bug</label>
      <label><input type="checkbox" value="style" checked> style</label>
      <label><input type="checkbox" value="security" checked> security</label>
      <label><input type="checkbox" value="performance" checked> performance</label>
      <label><input type="checkbox" value="readability" checked> readability</label>
      <label><input type="checkbox" value="design"> design</label>
    </div>
    <button class="primary" id="btn" onclick="startReview()">🚀 开始审查</button>
  </div>

  <!-- 右侧：Agent 轨迹 + 报告 -->
  <div class="right">
    <div class="card">
      <h2>Agent 执行轨迹 <span id="running-hint" style="display:none"><span class="spin"></span>审查进行中…</span></h2>
      <div id="timeline">
        <div class="evt pending"><span class="ts">--</span><span>提交代码后，这里将实时展示 Agent 的状态流转与工具调用过程</span></div>
      </div>
    </div>
    <div class="card" id="report-card" style="display:none">
      <h2>审查报告</h2>
      <div id="report"></div>
    </div>
  </div>
</div>
<footer>Code Review Agent · 通义千问（DashScope 原生 API）· 自研 ReAct 循环 · 8 态状态机</footer>

<script>
const $ = id => document.getElementById(id);
let pollTimer = null;

// 页面加载：健康检查（API Key 与模型）
fetch('/api/health').then(r => r.json()).then(h => {
  $('model-name').textContent = '模型：' + h.model;
  const dot = $('key-dot'), txt = $('key-text');
  if (h.api_key_configured) { dot.classList.add('ok'); txt.textContent = 'API Key 已配置'; }
  else { dot.classList.add('bad'); txt.textContent = '未配置 DASHSCOPE_API_KEY'; }
}).catch(() => { $('key-dot').classList.add('bad'); $('key-text').textContent = '服务不可用'; });

function loadExample(name) {
  fetch('/api/examples/' + name).then(r => {
    if (!r.ok) throw new Error('样例加载失败');
    return r.json();
  }).then(d => {
    $('code').value = d.code;
    $('filename').value = d.filename;
  }).catch(e => alert(e.message));
}

function loadFile(input) {
  const f = input.files[0];
  if (!f) return;
  f.text().then(t => { $('code').value = t; $('filename').value = f.name; });
}

function startReview() {
  const code = $('code').value;
  if (!code.trim()) { alert('请先输入或粘贴 Python 代码'); return; }
  const rules = [...document.querySelectorAll('#rules input:checked')].map(c => c.value);
  $('btn').disabled = true; $('btn').textContent = '⏳ 审查进行中…';
  $('report-card').style.display = 'none';
  $('running-hint').style.display = '';
  $('timeline').innerHTML = '';

  fetch('/api/review', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, filename: $('filename').value, rules })
  }).then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error(e.detail || '提交失败'); });
    return r.json();
  }).then(d => poll(d.task_id))
    .catch(e => { alert(e.message); resetUI(); });
}

function resetUI() {
  $('btn').disabled = false; $('btn').textContent = '🚀 开始审查';
  $('running-hint').style.display = 'none';
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

let lastEventCount = 0;
function poll(taskId) {
  lastEventCount = 0;
  pollTimer = setInterval(() => {
    fetch('/api/tasks/' + taskId).then(r => r.json()).then(task => {
      renderEvents(task);
      if (task.status === 'done') { renderReport(task, taskId); resetUI(); }
      else if (task.status === 'error') {
        $('timeline').insertAdjacentHTML('beforeend',
          `<div class="evt error"><span class="ts">✗</span><span>${task.error || '未知错误'}</span></div>`);
        resetUI();
      }
    });
  }, 1000);
}

function renderEvents(task) {
  const tl = $('timeline');
  const fresh = task.events.slice(lastEventCount);
  lastEventCount = task.events.length;
  for (const e of fresh) {
    tl.insertAdjacentHTML('beforeend',
      `<div class="evt ${e.type}"><span class="ts">${e.ts}s</span><span>${escapeHtml(e.text)}</span></div>`);
  }
  tl.scrollTop = tl.scrollHeight;
}

function renderReport(task, taskId) {
  const findings = task.findings || [];
  const counts = {};
  findings.forEach(f => counts[f.severity] = (counts[f.severity] || 0) + 1);
  const summary = Object.entries(counts).map(([k, v]) => `${k}×${v}`).join('　');

  let html = `<div class="summary-bar">
    <span>文件 <b>${escapeHtml(task.filename)}</b></span>
    <span>共发现 <b>${findings.length}</b> 条问题</span>
    <span>${summary}</span>
    <a class="dl" href="/api/tasks/${taskId}/report.md" download="review_report.md">⬇ 下载 Markdown 报告</a>
  </div>`;

  if (findings.length === 0) {
    html += `<div class="empty-hint">未发现问题，代码质量良好 🎉</div>`;
  }
  for (const f of findings) {
    const pct = Math.round((f.confidence || 0) * 100);
    html += `
    <div class="finding">
      <div class="f-head">
        <span class="badge ${f.severity}">${f.severity}</span>
        <span class="f-title">${escapeHtml(f.title)}</span>
        <div class="conf-wrap">
          <div class="conf-bar"><div class="conf-fill" style="width:${pct}%"></div></div>
          <span class="conf-num">置信度 ${pct}%</span>
        </div>
      </div>
      <div class="f-meta">${escapeHtml(f.file)} · L${f.line_start}-${f.line_end} · ${f.category}</div>
      <div class="f-sec">证据</div>
      <div class="f-body"><code>${escapeHtml(f.evidence)}</code></div>
      <div class="f-sec">修复建议</div>
      <div class="f-body">${escapeHtml(f.suggestion)}</div>
    </div>`;
  }
  $('report').innerHTML = html;
  $('report-card').style.display = '';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
